 <link rel="stylesheet" href="style.css">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden Elite Payment Details</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.92)),
url("watch.jpg");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

font-family:'Poppins',sans-serif;
color:#fff;
padding:20px;
}

.payment-card{

width:420px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

padding:40px 30px;

text-align:center;

box-shadow:
0 0 40px rgba(255,255,255,.08);

}

.logo{
font-family:'Cinzel',serif;
font-size:32px;
font-weight:700;
letter-spacing:2px;

margin-bottom:10px;

background:linear-gradient(90deg,#fff,#d9d9d9,#fff);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
color:#bdbdbd;
font-size:14px;
margin-bottom:30px;
}

.payment-methods{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:25px;
}

.payment-methods img{
width:120px;
height:70px;
object-fit:contain;

background:#fff;
padding:8px;
border-radius:12px;
}

.info-box{

background:#111;

border:1px solid #333;

border-radius:18px;

padding:18px;

margin:15px 0;
}

.label{
color:#999;
font-size:13px;
margin-bottom:6px;
}

.value{
font-size:22px;
font-weight:600;
}

.copy-btn{

margin-top:20px;

width:100%;

padding:15px;

border:none;

border-radius:50px;

background:#fff;
color:#000;

font-weight:700;
font-size:15px;

cursor:pointer;

transition:.3s;
}

.copy-btn:hover{
transform:translateY(-3px);
}

.back-btn{

display:block;

margin-top:15px;

text-decoration:none;

color:#fff;

border:1px solid #444;

padding:12px;

border-radius:50px;

transition:.3s;
}

.back-btn:hover{
background:#fff;
color:#000;
}

.note{
margin-top:20px;
font-size:13px;
color:#9a9a9a;
}

</style>
</head>

<body>

<div class="payment-card">

<div class="logo">GOLDEN ELITE</div>

<p class="subtitle">
Secure Payment Information
</p>

<div class="payment-methods">

<img src="easypaisa.jpeg" alt="EasyPaisa">

<img src="upaisa.png" alt="upaisa">

</div>

<div class="info-box">
<div class="label">ACCOUNT HOLDER</div>
<div class="value">GHAZALA SHABBIR</div>
</div>

<div class="info-box">
<div class="label">EASYPAISA / UPAISA</div>
<div class="value">0315 1180396</div>
</div>

<button class="copy-btn"
onclick="copyNumber()">
COPY PAYMENT NUMBER
</button>

<a href="index.html" class="back-btn">
← BACK TO STORE
</a>

<p class="note">
After payment, send payment screenshot on WhatsApp for order confirmation.
</p>

</div>

<script>

function copyNumber(){

navigator.clipboard.writeText("03151180396");

alert("Payment Number Copied Successfully");

}

</script>

</body>
</html>
